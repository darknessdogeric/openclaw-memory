# Email Configuration
# 请填写你的邮箱信息
# 注意: 建议使用App专用密码而非主密码

imap:
  server: imap.gmail.com  # Gmail用户
  # server: imap.163.com   # 网易用户
  # server: imap.qq.com    # QQ用户
  port: 993
  username: ""  # 你的邮箱地址
  password: ""  # 你的App专用密码

smtp:
  server: smtp.gmail.com  # Gmail用户
  # server: smtp.163.com   # 网易用户
  # server: smtp.qq.com    # QQ用户
  port: 587
  username: ""  # 你的邮箱地址
  password: ""  # 你的App专用密码

# Gmail App密码获取方法:
# 1. 访问 https://myaccount.google.com/apppasswords
# 2. 生成16位应用密码
# 3. 复制到此配置文件
