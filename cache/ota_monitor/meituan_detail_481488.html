<script>
function CPSOrderHandler() {

        this.helper = {
            cookie: {
                getCookie: function (objName) {
                    b = document['cookie'].match("(?:;|^)\\s*" + objName + "\\s*=\\s*([^;]+)\\s*(?:;|$)");
                    return b && b[1];
                }
            }
        }

        this._data = {
            /** CPS页面的页面配置枚举 */
            cpsPagesConfigEnum: {},
            cpsConfigKey: -999,
            currentIBanPageInfo: {
                pathname: '',
                params: '',
            },
            ibanPage2MeituanAppUrl: '',
            cookie: {},
            ua: '',
            inMetuanApp: false,
        }

        /** 定义需要跳转的页面类型枚举 */
        this._initCPSPagesEnum = function () {
            var cpsPagesConfigEnum;
            (function (cpsPagesConfigEnum) {
                cpsPagesConfigEnum[cpsPagesConfigEnum["SEARCH"] = 1] = "SEARCH";
                cpsPagesConfigEnum[cpsPagesConfigEnum["LIST"] = 2] = "LIST";
                cpsPagesConfigEnum[cpsPagesConfigEnum["DEAL"] = 3] = "DEAL";
                cpsPagesConfigEnum[cpsPagesConfigEnum["PREPAY"] = 4] = "PREPAY";
            })(cpsPagesConfigEnum || (cpsPagesConfigEnum = {}));
            this._data.cpsPagesConfigEnum = cpsPagesConfigEnum;
        }
        /** 初始化当前 iBan 页面的路径和参数 */
        this._initCurrentIBanPageInfo = function () {
            var _qsString = ''
            var _qsObj = {}
            if (location.search.lastIndexOf('?') !== -1) {
                _qsString = (location.search.split('?')[1]).split('&') || [];
                _qsString.map(function (item) {
                    _qsObj[item.split("=")[0]] = item.split("=")[1]
                })
            }
            this._data.currentIBanPageInfo = {
                pathname: location.pathname,
                params: _qsObj
            }

            if (_qsObj.keyword) {
                this._data.currentIBanPageInfo.params.q = _qsObj.keyword
            }
            this._data.currentIBanPageInfo.params.checkinDate = _qsObj.checkIn ? _qsObj.checkIn : '';
            this._data.currentIBanPageInfo.params.checkoutDate = _qsObj.checkOut ? _qsObj.checkOut : '';
            if (_qsObj.poiId) {
                this._data.currentIBanPageInfo.params.poi_id = _qsObj.poiId;
            }

            if (_qsObj.goodsId) {
                this._data.currentIBanPageInfo.params.goods_id = _qsObj.goodsId;
            }

            if (_qsObj.bizType) {
                this._data.currentIBanPageInfo.params.biz_type = _qsObj.bizType;
            }

            if (_qsObj.hotelchannel) {
                this._data.currentIBanPageInfo.params.hotelchannel = _qsObj.hotelchannel;
            }

        }
        /** 初始化当前要跳到原生界面的路径标志，这里指的是 CpsConfigKey*/
        this._initCpsConfigKey = function () {
            var _self = this;
            var pathName = _self._data.currentIBanPageInfo.pathname;
            var pathList = {
                '/search/search.html': function () {
                    _self._data.cpsConfigKey = _self._data.cpsPagesConfigEnum.SEARCH
                },
                '/list/list.html': function () {
                    _self._data.cpsConfigKey = _self._data.cpsPagesConfigEnum.LIST;
                },
                '/poi/deal.html': function () {
                    _self._data.cpsConfigKey = _self._data.cpsPagesConfigEnum.DEAL;
                },
                '/prepay/index.html': function () {
                    _self._data.cpsConfigKey = _self._data.cpsPagesConfigEnum.PREPAY;
                }
            }

            for (var key in pathList) {
                if (Object.hasOwnProperty.call(pathList, key)) {
                    if (pathName.search(key) !== -1) {
                        var handler = pathList[key];
                        handler()
                    }
                }
            }
        }
        /** 初始化当前 cookie 的信息 */
        this._initUrlParamsFromCookie = function () {
            var qs = this._data.currentIBanPageInfo.params;


            if (!qs.cityId) {
                this._data.currentIBanPageInfo.params.cityId = this.helper.cookie.getCookie('ci');
                this._data.currentIBanPageInfo.params.cityName = decodeURIComponent(this.helper.cookie.getCookie('cityname'));
            }
            this._data.currentIBanPageInfo.params.city_id = this._data.currentIBanPageInfo.params.cityId;
            this._data.currentIBanPageInfo.params.cityid = this._data.currentIBanPageInfo.params.cityId;

        }
        /** 根据页面类型不同，拼接不同的美团app原生跳转链接及参数 */
        this._initNavToMeituanAppHandler = function () {
            var qs = this._data.currentIBanPageInfo.params;
            switch (this._data.cpsConfigKey) {
                case this._data.cpsPagesConfigEnum.SEARCH:
                    this._searchPageHandler(qs)
                    break;
                case this._data.cpsPagesConfigEnum.DEAL:
                    this._dealPageHandler(qs)
                    break;
                case this._data.cpsPagesConfigEnum.LIST:
                    this._listPageHandler(qs)
                    break;
                case this._data.cpsPagesConfigEnum.PREPAY:
                    this._prepayPageHandler(qs)
                    break;
                default:
                    break;
            }
        }

        this._searchPageHandler = function (qs) {
            var _params = ``
            if (qs.cityid && qs.cityName) {
                _params += `?cityid=${qs.cityid}&cityName=${encodeURIComponent(qs.cityName)}`
            }
            if (qs.checkInDate && qs.checkOutDate) {
                _params += `?checkInDate=${qs.checkInDate}&checkOutDate=${qs.checkOutDate}`
            }

            _params = this.hotelchannelHandler(qs, _params);

            this._data.ibanPage2MeituanAppUrl = 'imeituan://www.meituan.com/hotel/homepage' + _params;
        }
        this._dealPageHandler = function (qs) {
            var _params = ``
            if (qs.poi_id) {
                _params += `poi_id=${qs.poi_id}&poiId=${qs.poi_id}&id=${qs.poi_id}`
            }
            _params = this.hotelchannelHandler(qs, _params);
            this._data.ibanPage2MeituanAppUrl = 'imeituan://www.meituan.com/hotel/poi?' + _params
        }
        this._listPageHandler = function (qs) {
            var _params = ``
            if (qs.checkinDate && qs.checkoutDate) {
                _params += `checkInDate=${encodeURIComponent(qs.checkinDate)}&checkOutDate=${encodeURIComponent(qs.checkoutDate)}&`
            }
            if (qs.city_id) {
                _params += `city_id=${qs.city_id}`
            }

            if (qs.q) {
                _params += `&q=${qs.q}`
            }
            _params = this.hotelchannelHandler(qs, _params);

            this._data.ibanPage2MeituanAppUrl = 'imeituan://www.meituan.com/hotel/list?' + _params;
        }
        this._prepayPageHandler = function (qs) {
            var _params = ``
            if (qs.goods_id) {
                _params += `goods_id=${qs.goods_id}&`
            }
            if (qs.checkinDate && qs.checkoutDate) {
                _params += `checkinDate=${qs.checkinDate}&checkoutDate=${qs.checkoutDate}&`
                if (qs.checkinDate === qs.checkoutDate) {
                    _params += `goodstype=2&`
                } else {
                    _params += `goodstype=1&`
                }
            }

            if (qs.biz_type) {
                _params += `biz_type=${qs.biz_type}`
            }
            _params = this.hotelchannelHandler(qs, _params);

            this._data.ibanPage2MeituanAppUrl = 'imeituan://www.meituan.com/hotel/submitorder?' + _params;
        }

        this.goToMeituanApp = function () {
            KNB.jumpPage({
                //需要打开的完整http链接
                url: cps._data.ibanPage2MeituanAppUrl,
                // 不要依赖openPage success，如果当前success执行过长会导致下个webview卡主
                fail: function (error) {
                    // 上报
                }
            });
        }

        this.init = function () {
            // 注意初始化顺序，很重要
            this._initCPSPagesEnum();
            this._initCurrentIBanPageInfo();
            this._initCpsConfigKey();
            this._initUrlParamsFromCookie();
            this._initNavToMeituanAppHandler();
        }

        /**
         * https://km.sankuai.com/page/1270190139
         * 需求描述：i 版页面唤起 APP / 小程序时，需获取本身链接上的渠道参数（hotelchannel=xxx）拼接到唤起的落地页跳链上

            如 i 版链接为：https://i.meituan.com/awp/h5/hotel/search/search.html?hotelchannel=UmSvEiNBjJb，唤起的 APP 页面为前置页（imeituan://www.meituan.com/hotel/homepage）

            则需要获取 i 版链接上的参数（hotelchannel=UmSvEiNBjJb）拼接到唤起的 APP 页面跳链上后再唤起，最终唤起的页面跳链为：imeituan://www.meituan.com/hotel/homepage?hotelchannel=UmSvEiNBjJb
         */
        this.hotelchannelHandler = function (qs, params) {
            if (qs.hotelchannel) {
