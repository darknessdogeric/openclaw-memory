<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>酒店场景展示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px;
    font-family: "Noto Sans SC", "Microsoft YaHei", "SimHei", sans-serif;
    background: #040D1F;
    position: relative; overflow: hidden;
  }

  /* Background */
  .bg-main {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 120% 80% at 50% 0%, #0D2240 0%, #040D1F 55%, #020810 100%);
  }
  .bg-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 50px 50px;
  }
  .bg-bottom {
    position: absolute; bottom: 0; left: 0; right: 0; height: 200px;
    background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, transparent 100%);
  }

  /* Top bar */
  .top-bar {
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, rgba(0,212,255,0.5), rgba(0,212,255,0.15), rgba(255,184,0,0.15), rgba(255,184,0,0.5));
  }

  /* Header */
  .header {
    position: absolute; top: 40px; left: 60px; right: 60px;
    display: flex; justify-content: space-between; align-items: flex-start;
    z-index: 2;
  }
  .logo-area { display: flex; align-items: center; gap: 14px; }
  .logo-chr {
    width: 56px; height: 56px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 900;
  }
  .logo-A { background: rgba(255,255,255,0.07); color: #fff; border: 1px solid rgba(255,255,255,0.12); }
  .logo-H { background: rgba(0,212,255,0.12); color: #00D4FF; border: 1px solid rgba(0,212,255,0.25); }
  .logo-L { background: rgba(255,184,0,0.07); color: rgba(255,184,0,0.9); border: 1px solid rgba(255,184,0,0.2); }
  .brand-text { }
  .brand-en { font-size: 11px; letter-spacing: 5px; color: rgba(0,212,255,0.4); text-transform: uppercase; }
  .brand-cn { font-size: 20px; font-weight: 700; color: #fff; letter-spacing: 4px; }
  .header-badge {
    background: rgba(0,212,255,0.07);
    border: 1px solid rgba(0,212,255,0.15);
    border-radius: 100px; padding: 8px 20px;
    font-size: 13px; color: rgba(0,212,255,0.7);
    letter-spacing: 2px;
  }

  /* Title */
  .main-title-area {
    position: absolute; top: 140px; left: 60px;
    z-index: 2;
  }
  .main-title {
    font-size: 60px; font-weight: 900;
    color: #fff; letter-spacing: 6px;
    margin-bottom: 12px;
  }
  .main-title em {
    font-style: normal;
    background: linear-gradient(135deg, #00D4FF, #FFB800);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .main-sub { font-size: 20px; color: rgba(255,255,255,0.4); letter-spacing: 4px; }

  /* Image grid area */
  .img-grid {
    position: absolute;
    top: 280px; left: 60px; right: 60px;
    height: 480px;
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 12px;
  }
  .img-card {
    border-radius: 16px;
    position: relative; overflow: hidden;
    display: flex; align-items: flex-end;
    background: linear-gradient(135deg, #0A1628, #0D2240);
  }
  .img-card::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(0deg, rgba(0,0,0,0.6) 0%, transparent 50%);
  }
  .img-card.large { grid-column: 1; grid-row: 1 / 3; }
  .img-card.m1 { grid-column: 2; grid-row: 1; }
  .img-card.m2 { grid-column: 3; grid-row: 1; }
  .img-card.m3 { grid-column: 2 / 4; grid-row: 2; }

  /* Simulated image placeholders */
  .img-visual {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .img-visual-icon { font-size: 60px; opacity: 0.3; }
  .img-label {
    position: relative; z-index: 2;
    padding: 14px 18px;
  }
  .img-label-title { font-size: 16px; font-weight: 700; color: #fff; letter-spacing: 1px; }
  .img-label-sub { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 2px; }

  /* ic1: hotel lobby - grand */
  .ic1 { background: linear-gradient(135deg, #0A1E38 0%, #1a2f50 50%, #0D2240 100%); }
  /* ic2: restaurant */
  .ic2 { background: linear-gradient(135deg, #1a0f0a 0%, #2a1a10 50%, #0D1A0F 100%); }
  /* ic3: guest room */
  .ic3 { background: linear-gradient(135deg, #0a1520 0%, #102030 50%, #0a1628 100%); }
  /* ic4: banquet / lobby bar */
  .ic4 { background: linear-gradient(135deg, #0A1628 0%, #1a1040 50%, #0D2240 100%); }

  /* Bottom stats */
  .stats-bar {
    position: absolute;
    bottom: 50px; left: 60px; right: 60px;
    display: flex; justify-content: space-between; align-items: flex-end;
    z-index: 2;
  }
  .stats-left { display: flex; gap: 40px; }
  .stat-item { text-align: left; }
  .stat-num {
    font-size: 40px; font-weight: 800;
    background: linear-gradient(135deg, #00D4FF, #fff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    line-height: 1;
  }
  .stat-label { font-size: 13px; color: rgba(255,255,255,0.35); letter-spacing: 2px; margin-top: 4px; }
  .stats-right { text-align: right; }
  .contact-num { font-size: 22px; font-weight: 700; color: #00D4FF; letter-spacing: 4px; }
  .contact-org { font-size: 13px; color: rgba(255,255,255,0.3); letter-spacing: 2px; margin-top: 4px; }

  /* Corner marks */
  .c-tl, .c-tr, .c-bl, .c-br { position: absolute; width: 32px; height: 32px; z-index: 2; }
  .c-tl { top: 14px; left: 14px; border-top: 1.5px solid rgba(0,212,255,0.18); border-left: 1.5px solid rgba(0,212,255,0.18); }
  .c-tr { top: 14px; right: 14px; border-top: 1.5px solid rgba(0,212,255,0.18); border-right: 1.5px solid rgba(0,212,255,0.18); }
  .c-bl { bottom: 14px; left: 14px; border-bottom: 1px solid rgba(255,184,0,0.1); border-left: 1px solid rgba(255,184,0,0.1); }
  .c-br { bottom: 14px; right: 14px; border-bottom: 1px solid rgba(255,184,0,0.1); border-right: 1px solid rgba(255,184,0,0.1); }
</style>
</head>
<body>

<div class="bg-main"></div>
<div class="bg-grid"></div>
<div class="bg-bottom"></div>
<div class="top-bar"></div>
<div class="c-tl"></div>
<div class="c-tr"></div>
<div class="c-bl"></div>
<div class="c-br"></div>

<!-- Header -->
<div class="header">
  <div class="logo-area">
    <div class="logo-chr logo-A">A</div>
    <div class="logo-chr logo-H">H</div>
    <div class="logo-chr logo-L">L</div>
    <div class="brand-text">
      <div class="brand-en">AI Hotel Language</div>
      <div class="brand-cn">AHL</div>
    </div>
  </div>
  <div class="header-badge">AI酒店赋能解决方案</div>
</div>

<!-- Title -->
<div class="main-title-area">
  <div class="main-title">用<em>AI</em>重新定义酒店服务</div>
  <div class="main-sub">去中心化交易 · 双AGENT协同 · 87个细分场景</div>
</div>

<!-- Image grid (simulated with gradient placeholders) -->
<div class="img-grid">
  <!-- Large: Hotel lobby -->
  <div class="img-card large ic1">
    <div class="img-visual"><div class="img-visual-icon">🏨</div></div>
    <div class="img-label">
      <div class="img-label-title">智能大堂</div>
      <div class="img-label-sub">AI迎宾 · 自助入住 · 数字礼宾</div>
    </div>
  </div>
  <!-- Medium: Restaurant -->
  <div class="img-card m1 ic2">
    <div class="img-visual"><div class="img-visual-icon">🍽</div></div>
    <div class="img-label">
      <div class="img-label-title">智慧餐饮</div>
      <div class="img-label-sub">AI餐厅顾问</div>
    </div>
  </div>
  <!-- Medium: Guest room -->
  <div class="img-card m2 ic3">
    <div class="img-visual"><div class="img-visual-icon">🛏</div></div>
    <div class="img-label">
      <div class="img-label-title">智能客房</div>
      <div class="img-label-sub">语音控制 · 个性化</div>
    </div>
  </div>
  <!-- Wide: Banquet -->
  <div class="img-card m3 ic4">
    <div class="img-visual"><div class="img-visual-icon">🎭</div></div>
    <div class="img-label">
      <div class="img-label-title">宴会与会议</div>
      <div class="img-label-sub">智能宴会策划 · 全流程AI运营官协同</div>
    </div>
  </div>
</div>

<!-- Bottom -->
<div class="stats-bar">
  <div class="stats-left">
    <div class="stat-item">
      <div class="stat-num">2%</div>
      <div class="stat-label">技术服务费（vs OTA 15-25%）</div>
    </div>
    <div class="stat-item">
      <div class="stat-num">95%+</div>
      <div class="stat-label">AI匹配准确率</div>
    </div>
    <div class="stat-item">
      <div class="stat-num">87</div>
      <div class="stat-label">AI SKILL场景覆盖</div>
    </div>
  </div>
  <div class="stats-right">
    <div class="contact-num">17760348653</div>
    <div class="contact-org">ahlprotocol.ai · 种子轮融资中</div>
  </div>
</div>

</body>
</html>
