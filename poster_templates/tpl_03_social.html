<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>朋友圈素材</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1920px;
    font-family: "Noto Sans SC", "Microsoft YaHei", "SimHei", sans-serif;
    background: #040D1F;
    position: relative; overflow: hidden;
  }

  /* Background */
  .bg-main {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 120% 70% at 50% 20%, #0D2240 0%, #040D1A 45%, #020810 100%);
  }
  .bg-glow-left { position: absolute; width: 400px; height: 400px; top: 30%; left: -80px; transform: translateY(-50%); border-radius: 50%; background: radial-gradient(circle, rgba(0,180,255,0.09) 0%, transparent 70%); }
  .bg-glow-right { position: absolute; width: 300px; height: 300px; top: 60%; right: -60px; border-radius: 50%; background: radial-gradient(circle, rgba(255,184,0,0.06) 0%, transparent 70%); }
  .bg-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 50px 50px;
  }
  .bg-bottom {
    position: absolute; bottom: 0; left: 0; right: 0; height: 35%;
    background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, transparent 100%);
  }

  /* Corner marks */
  .c-tl, .c-tr, .c-bl, .c-br { position: absolute; width: 36px; height: 36px; z-index: 2; }
  .c-tl { top: 16px; left: 16px; border-top: 1.5px solid rgba(0,212,255,0.2); border-left: 1.5px solid rgba(0,212,255,0.2); }
  .c-tr { top: 16px; right: 16px; border-top: 1.5px solid rgba(0,212,255,0.2); border-right: 1.5px solid rgba(0,212,255,0.2); }
  .c-bl { bottom: 16px; left: 16px; border-bottom: 1px solid rgba(255,184,0,0.12); border-left: 1px solid rgba(255,184,0,0.12); }
  .c-br { bottom: 16px; right: 16px; border-bottom: 1px solid rgba(255,184,0,0.12); border-right: 1px solid rgba(255,184,0,0.12); }

  /* Top section */
  .top-section {
    position: relative; z-index: 1;
    padding: 50px 50px 0;
  }
  .logo-row { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .logo-chr {
    width: 58px; height: 58px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 900;
  }
  .logo-A { background: rgba(255,255,255,0.07); color: #fff; border: 1px solid rgba(255,255,255,0.12); }
  .logo-H { background: rgba(0,212,255,0.1); color: #00D4FF; border: 1px solid rgba(0,212,255,0.25); }
  .logo-L { background: rgba(255,184,0,0.07); color: rgba(255,184,0,0.9); border: 1px solid rgba(255,184,0,0.2); }
  .brand-en { font-size: 10px; letter-spacing: 5px; color: rgba(0,212,255,0.4); text-transform: uppercase; margin-bottom: 4px; }
  .brand-cn { font-size: 36px; font-weight: 700; color: #fff; letter-spacing: 6px; }

  /* Hero text */
  .hero {
    font-size: 52px; font-weight: 900; color: #fff;
    letter-spacing: 4px; line-height: 1.3;
    margin-bottom: 8px;
  }
  .hero em { font-style: normal; background: linear-gradient(135deg, #00D4FF, #FFB800); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .hero-sub { font-size: 18px; color: rgba(0,212,255,0.6); letter-spacing: 3px; margin-bottom: 24px; }

  /* Agent architecture diagram */
  .arch-diagram {
    background: rgba(0,212,255,0.04);
    border: 1px solid rgba(0,212,255,0.1);
    border-radius: 18px;
    padding: 20px 16px;
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 24px;
  }
  .arch-box {
    flex: 1; text-align: center;
    background: rgba(0,212,255,0.06);
    border: 1px solid rgba(0,212,255,0.15);
    border-radius: 12px; padding: 14px 8px;
  }
  .arch-box.right {
    background: rgba(255,184,0,0.06);
    border-color: rgba(255,184,0,0.15);
  }
  .arch-icon { font-size: 22px; margin-bottom: 6px; }
  .arch-title { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 2px; }
  .arch-sub { font-size: 10px; color: rgba(255,255,255,0.4); }
  .arch-hub {
    width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
    background: rgba(0,212,255,0.1);
    border: 1px solid rgba(0,212,255,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .arch-arrow { font-size: 18px; color: rgba(0,212,255,0.3); flex-shrink: 0; }

  /* Stats row */
  .stats-row { display: flex; gap: 12px; margin-bottom: 24px; }
  .stat-card {
    flex: 1; border-radius: 14px; padding: 16px 10px;
    text-align: center; position: relative; overflow: hidden;
  }
  .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
  .stat-c1::before { background: linear-gradient(90deg, transparent, #00D4FF, transparent); }
  .stat-c2::before { background: linear-gradient(90deg, transparent, #FFB800, transparent); }
  .stat-c3::before { background: linear-gradient(90deg, transparent, #A855F7, transparent); }
  .stat-num { font-size: 32px; font-weight: 800; line-height: 1; }
  .stat-c1 .stat-num { background: linear-gradient(135deg, #00D4FF, #fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .stat-c2 .stat-num { background: linear-gradient(135deg, #FFB800, #fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .stat-c3 .stat-num { background: linear-gradient(135deg, #A855F7, #fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .stat-label { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 4px; letter-spacing: 1px; }

  /* Mission statement */
  .mission {
    background: rgba(0,212,255,0.05);
    border: 1px solid rgba(0,212,255,0.12);
    border-radius: 16px; padding: 22px 24px;
    margin-bottom: 24px;
  }
  .mission-text {
    font-size: 18px; color: rgba(255,255,255,0.65);
    letter-spacing: 2px; line-height: 1.8; text-align: center;
  }
  .mission-text strong { color: #fff; font-weight: 700; }

  /* Tags */
  .tag-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .tag {
    font-size: 12px; padding: 5px 14px; border-radius: 100px;
    background: rgba(0,212,255,0.06); border: 1px solid rgba(0,212,255,0.12);
    color: rgba(0,212,255,0.5); letter-spacing: 0.5px;
  }

  /* Contact */
  .contact { text-align: center; }
  .contact-line { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
  .cl { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(0,212,255,0.25)); }
  .cl-r { flex: 1; height: 1px; background: linear-gradient(90deg, rgba(0,212,255,0.25), transparent); }
  .cl-text { font-size: 11px; color: rgba(0,212,255,0.35); letter-spacing: 3px; text-transform: uppercase; white-space: nowrap; }
  .contact-num { font-size: 26px; font-weight: 700; color: #00D4FF; letter-spacing: 4px; margin-bottom: 8px; }
  .contact-sub { font-size: 13px; color: rgba(255,255,255,0.25); letter-spacing: 2px; }
</style>
</head>
<body>

<div class="bg-main"></div>

</body>
</html>
