const width = window.innerWidth;
const height = window.innerHeight;

const svg = d3.select("#mindmap")
  .attr("width", width)
  .attr("height", height);

const g = svg.append("g");

const zoom = d3.zoom()
  .scaleExtent([0.2, 2])
  .on("zoom", (event) => g.attr("transform", event.transform));
svg.call(zoom);

const root = d3.hierarchy(data);

// Calculate tree layout
const dx = 24;
const dy = width / 7;

function wrapText(text, maxChars) {
  if (!text) return [""];
  const lines = text.split('\n');
  return lines;
}

// Assign sizes based on text content
root.descendants().forEach(d => {
  const lines = d.data.name.split('\n');
  const maxLineLen = Math.max(...lines.map(l => l.length));
  const w = Math.max(maxLineLen * 13 + 32, 100);
  const h = Math.max(lines.length * 16 + 24, 36);
  d._w = w;
  d._h = h;
});

// Manually compute positions for a compact left-to-right layout
// Use a custom layout algorithm

function computeLayout(node, level, yOffset) {
  const nodeHeight = node._h;
  const nodeWidth = node._w;
  const x = level * (dy * 0.9) + 40;

  if (!node.children || node.children.length === 0) {
    node.x = x;
    node.y = yOffset + nodeHeight / 2;
    return nodeHeight + 16; // return total height consumed
  }

  // Compute children layouts first
  let totalChildrenHeight = 0;
  const childOffsets = [];
  for (const child of node.children) {
    const childH = computeLayout(child, level + 1, yOffset + totalChildrenHeight);
    childOffsets.push(totalChildrenHeight);
    totalChildrenHeight += childH;
  }

  // Center this node vertically relative to its children
  const childrenMid = totalChildrenHeight / 2;
  node.x = x;
  node.y = yOffset + childrenMid;

  return Math.max(totalChildrenHeight, nodeHeight + 16);
}

computeLayout(root, 0, 0);

// Compute SVG dimensions needed
let maxX = 0, maxY = 0;
root.descendants().forEach(d => {
  maxX = Math.max(maxX, d.x + d._w + 40);
  maxY = Math.max(maxY, d.y + d._h + 20);
});

svg.attr("width", Math.max(width, maxX))
   .attr("height", Math.max(height, maxY));

// Draw links
const link = g.append("g")
  .selectAll("path")
  .data(root.links())
  .join("path")
  .attr("class", "link")
  .attr("d", d => {
    const sx = d.source.x + d.source._w;
    const sy = d.source.y;
    const tx = d.target.x;
    const ty = d.target.y;
    const mx = (sx + tx) / 2;
    return `M${sx},${sy} C${mx},${sy} ${mx},${ty} ${tx},${ty}`;
  });

// Draw nodes
const node = g.append("g")
  .selectAll("g")
  .data(root.descendants())
  .join("g")
  .attr("class", d => `node ${d.data.className}`)
  .attr("transform", d => `translate(${d.x},${d.y - d._h / 2})`);

node.append("rect")
  .attr("width", d => d._w)
  .attr("height", d => d._h);

node.append("text")
  .attr("x", 10)
  .attr("y", d => d._h / 2)
  .each(function(d) {
    const lines = d.data.name.split('\n');
    const textEl = d3.select(this);
    lines.forEach((line, i) => {
      if (i === 0) {
        textEl.text(line);
      }
      textEl.append("tspan")
        .attr("x", 10)
        .attr("dy", i === 0 ? 0 : 15)
        .text(line);
    });
  });

// Fix text: only show first line, then tspans
node.selectAll("text").remove();
node.append("text")
  .each(function(d) {
    const lines = d.data.name.split('\n');
    const el = d3.select(this);
    el.attr("x", 10)
      .attr("y", d._h / 2 - (lines.length - 1) * 7.5)
      .style("font-size", d.data.className === "root" ? "14px" :
              d.data.className === "lvl1" ? "13px" :
              d.data.className === "lvl2" ? "12px" :
              d.data.className === "lvl3" ? "11px" : "10px")
      .style("font-weight", (d.data.className === "root" || d.data.className === "lvl1") ? "bold" : "normal")
      .style("fill", (d.data.className === "root" || d.data.className === "lvl1" || d.data.className === "lvl2") ? "#fff" : "#333");
    
    el.append("tspan").attr("x", 10).attr("dy", 0).text(lines[0]);
    for (let i = 1; i < lines.length; i++) {
      el.append("tspan")
        .attr("x", 10)
        .attr("dy", 15)
        .text(lines[i]);
    }
  });

// Fit to view
const bbox = g.node().getBBox();
const padding = 60;
const fullW = bbox.width + padding * 2;
const fullH = bbox.height + padding * 2;
const scale = Math.min(1, width / fullW, height / fullH);
const tx = (width - bbox.width * scale) / 2 - bbox.x * scale;
const ty = (height - bbox.height * scale) / 2 - bbox.y * scale;
svg.call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale * 0.9));
