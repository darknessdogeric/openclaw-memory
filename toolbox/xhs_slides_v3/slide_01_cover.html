<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>限制功能性产品本地社区化设计 · 五要素方法论</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1440px;
    background: #fff; font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #1a1a1a; display: flex; flex-direction: column; overflow: hidden;
  }
  /* 页眉 - 缩小 */
  .header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 48px 14px;
    border-bottom: 1.5px solid #1a1a1a;
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 48px; height: 48px; background: #1a1a1a; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #C9A961; font-size: 24px; font-weight: 700;
  }
  .logo-text { font-size: 14px; color: #444; line-height: 1.5; font-weight: 500; }
  .header-right { text-align: right; }
  .tag { display: inline-block; font-size: 14px; color: #444;
    border: 1.5px solid #1a1a1a; padding: 5px 14px; border-radius: 22px;
    margin-bottom: 4px; font-weight: 500; }
  .header-right .date { font-size: 13px; color: #444; }
  /* 主内容 - 最大化 */
  .main {
    flex: 1; display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    padding: 30px 56px; text-align: center;
  }
  .eyebrow { font-size: 18px; color: #C9A961; letter-spacing: 4px;
    margin-bottom: 22px; font-weight: 600; }
  .title {
    font-size: 80px; font-weight: 800; line-height: 1.15;
    color: #1a1a1a; margin-bottom: 22px; letter-spacing: -2px;
  }
  .subtitle { font-size: 32px; color: #333; margin-bottom: 14px; font-weight: 500; }
  .divider { width: 80px; height: 4px; background: #1B3A6B; margin: 26px auto; }
  .case-name { font-size: 22px; color: #555; margin-bottom: 38px; font-weight: 500; }
  .quote-box {
    border-left: 6px solid #C9A961; padding: 18px 30px;
    background: #fafaf6; max-width: 880px; text-align: left; margin-bottom: 38px;
  }
  .quote-box p { font-size: 24px; color: #1a1a1a; line-height: 1.7; font-weight: 500; }
  .stats-row { display: flex; gap: 56px; justify-content: center; margin-top: 14px; }
  .stat { text-align: center; }
  .stat .num { font-size: 72px; font-weight: 800; color: #C9A961;
    line-height: 1; margin-bottom: 8px; }
  .stat .label { font-size: 18px; color: #555; font-weight: 500; }
  /* 页脚 - 缩小 */
  .footer {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 48px; border-top: 1.5px solid #1a1a1a; font-size: 14px; color: #555;
  }
  .footer-left { display: flex; gap: 18px; align-items: center; }
  .footer-logo {
    width: 32px; height: 32px; background: #1a1a1a; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #C9A961; font-size: 15px; font-weight: 700;
  }
  .footer .series { font-size: 14px; color: #555; font-weight: 500; }
</style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <div class="logo">B</div>
      <div class="logo-text">B166ER 出品<br>方法论系列</div>
    </div>
    <div class="header-right">
      <div class="tag">Hospitality / Product Design</div>
      <div class="date">2026.07.20</div>
    </div>
  </div>

  <div class="main">
    <div class="eyebrow">MASTER PLAN · ERIC 出品</div>
    <div class="title">酒店限制性功能产品<br><span style="font-size:54px;font-weight:700;">本地社区化设计</span><br><span style="font-size:46px;font-weight:600;color:#1B3A6B;">五要素方法论</span></div>
    <div class="subtitle">从配套成本到价值引擎的本质重构</div>
    <div class="divider"></div>
    <div class="case-name">基于重庆某高星级酒店实战验证</div>
    <div class="quote-box">
      <p>产品设计的关键或者说底层逻辑应该是<br>
        <strong style="color:#1B3A6B;font-size:30px;">客源精准画像和沉淀。</strong></p>
    </div>
    <div class="stats-row">
      <div class="stat"><div class="num">+25万</div><div class="label">第一年纯增量收入</div></div>
      <div class="stat"><div class="num">100%</div><div class="label">零和博弈外的增量</div></div>
      <div class="stat"><div class="num">5要素</div><div class="label">可复用的方法论</div></div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-left">
      <div class="footer-logo">B</div>
      <span class="series">酒店限制性功能产品 · 方法论系列 · v2.0 · 2026.07.20</span>
    </div>
    <span>B166ER 出品</span>
  </div>
</body>
</html>
