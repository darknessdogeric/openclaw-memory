<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社区化早餐卡·实战案例</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1440px;
    background: #fff;
    font-family: "PingFang SC", "Microsoft YaHei", "SimHei", sans-serif;
    color: #1a1a1a;
    display: flex;
    flex-direction: column;
    padding: 0;
    overflow: hidden;
  }
  /* 页眉 */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 28px 52px 18px;
    border-bottom: 1px solid #e8e8e8;
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 44px; height: 44px;
    background: #1a1a1a;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #C9A961; font-size: 22px; font-weight: 700;
  }
  .logo-text {
    font-size: 11px; color: #888; line-height: 1.5;
  }
  .logo-text span { display: block; font-size: 13px; color: #1a1a1a; font-weight: 600; }
  .header-right { text-align: right; }
  .tag {
    display: inline-block;
    font-size: 11px; color: #888;
    border: 1px solid #ddd; padding: 3px 10px; border-radius: 20px;
    margin-bottom: 4px;
  }
  .header-right .date { font-size: 11px; color: #888; }
  /* 主内容 */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px 60px;
    text-align: center;
  }
  .eyebrow {
    font-size: 13px; color: #C9A961; letter-spacing: 3px;
    margin-bottom: 20px; text-transform: uppercase;
  }
  .title {
    font-size: 58px; font-weight: 700; line-height: 1.25;
    color: #1a1a1a; margin-bottom: 16px; letter-spacing: -1px;
  }
  .subtitle {
    font-size: 22px; color: #555; margin-bottom: 12px; font-weight: 400;
  }
  .divider {
    width: 60px; height: 3px; background: #1B3A6B; margin: 28px auto;
  }
  .case-name {
    font-size: 20px; color: #888; margin-bottom: 48px;
  }
  .case-name strong { color: #1B3A6B; }
  .quote-box {
    border-left: 4px solid #C9A961;
    padding: 16px 28px;
    background: #fafaf6;
    max-width: 720px;
    text-align: left;
    margin-bottom: 48px;
  }
  .quote-box p { font-size: 18px; color: #333; line-height: 1.8; }
  .stats-row {
    display: flex; gap: 48px; justify-content: center; margin-top: 16px;
  }
  .stat { text-align: center; }
  .stat .num {
    font-size: 44px; font-weight: 800; color: #C9A961;
    line-height: 1; margin-bottom: 6px;
  }
  .stat .label { font-size: 13px; color: #888; }
  /* 页脚 */
  .footer {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 52px;
    border-top: 1px solid #e8e8e8;
    font-size: 11px; color: #aaa;
  }
  .footer-left { display: flex; gap: 20px; align-items: center; }
  .footer-logo {
    width: 28px; height: 28px;
    background: #1a1a1a; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #C9A961; font-size: 14px; font-weight: 700;
  }
  .footer .series { font-size: 11px; color: #aaa; }
</style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <div class="logo">B</div>
      <div class="logo-text"><span>B166ER 出品</span>B166ER</div>
    </div>
    <div class="header-right">
      <div class="tag">Hospitality / Product Design</div>
      <div class="date">2026.07.20</div>
    </div>
  </div>

  <div class="main">
    <div class="eyebrow">MASTER PLAN · ERIC 出品</div>
    <div class="title">社区化早餐卡<br>实战案例复盘</div>
    <div class="subtitle">重庆丽苑维景国际大酒店 · 2020-2024</div>
    <div class="divider"></div>
    <div class="case-name">Eric 在任副总经理期间亲自操盘设计</div>
    <div class="quote-box">
      <p>产品设计的关键或者说底层逻辑应该是<br><strong style="color:#1B3A6B;font-size:20px;">客源精准画像和沉淀。</strong></p>
    </div>
    <div class="stats-row">
      <div class="stat">
        <div class="num">+25万</div>
        <div class="label">第一年早餐厅收入增量</div>
      </div>
      <div class="stat">
        <div class="num">100%</div>
        <div class="label">纯增量·零和博弈外</div>
      </div>
      <div class="stat">
        <div class="num">四象限</div>
        <div class="label">周边精准客群画像</div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-left">
      <div class="footer-logo">B</div>
      <span class="series">实战案例系列 · v2.0</span>
    </div>
    <span>B166ER 出品 · 2026.07.20</span>
  </div>
</body>
</html>
