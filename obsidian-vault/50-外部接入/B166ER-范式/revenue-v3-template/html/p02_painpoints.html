<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Brutalist P02</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700;900&family=Noto+Serif+SC:wght@400;600;700;900&family=Inter:wght@200;300;400;500;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&family=IBM+Plex+Mono:wght@400;500;700&display=swap"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Inter","Noto Sans SC","IBM Plex Mono",sans-serif;background:#2a2a2a;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.poster{width:1080px;height:1440px;position:relative;overflow:hidden;display:grid;grid-template-rows:130px 1fr 110px;color:#0a0a0a;font-family:"Inter","Noto Sans SC",sans-serif}
/* 顶部条 */
.top{padding:36px 60px 0;display:flex;justify-content:space-between;align-items:center;border-bottom:6px solid #0a0a0a;margin:0 60px;font-family:"IBM Plex Mono",monospace}
.brand{font-size:22px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#0a0a0a}
.meta{font-size:20px;font-weight:700;letter-spacing:.1em;color:#0a0a0a}
/* 主区 */
.main{padding:36px 60px 24px;display:flex;flex-direction:column;position:relative}
/* kicker */
.kicker{font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:700;letter-spacing:.35em;text-transform:uppercase;margin-bottom:14px;display:inline-block;padding:6px 14px;background:#0a0a0a;color:#fafafa;align-self:flex-start}
.kicker.light{background:#fafafa;color:#0a0a0a;border:4px solid #0a0a0a}
.kicker.red{background:#e63946;color:#fafafa}
/* h1: 100-110px */
h1{font-family:"Noto Serif SC","Inter",serif;font-size:104px;font-weight:900;line-height:.95;letter-spacing:-.04em;margin-bottom:18px;text-transform:none}
h1 em{font-style:normal;color:#e63946;font-family:"Cormorant Garamond",serif;font-weight:900}
h1 u{text-decoration:none;background:#ffb703;color:#0a0a0a;padding:0 12px;display:inline-block;transform:rotate(-2deg)}
h1 .strike{position:relative;display:inline-block}
h1 .strike::after{content:"";position:absolute;left:-4%;right:-4%;top:50%;height:14px;background:#e63946;transform:rotate(-2deg)}
/* lede */
.lede{font-family:"Noto Serif SC",serif;font-size:28px;color:#0a0a0a;line-height:1.45;margin-bottom:24px;font-weight:500}
/* 底部 */
.bottom{padding:0 60px;border-top:6px solid #0a0a0a;margin:0 60px;display:flex;justify-content:space-between;align-items:center}
.stamp{font-family:"IBM Plex Mono",monospace;font-size:18px;font-weight:700;letter-spacing:.15em;color:#0a0a0a;text-transform:uppercase}
.by{font-family:"Inter","Noto Sans SC",sans-serif;font-size:24px;font-weight:900;letter-spacing:.04em;color:#0a0a0a;text-transform:uppercase;display:flex;align-items:center}
.by .s{display:inline-block;width:22px;height:22px;background:#e63946;margin-right:12px}
/* === 黑白交替 变体 === */
/* 默认 LIGHT */
.poster.light{background:#fafafa;color:#0a0a0a}
.poster.light .top{border-bottom-color:#0a0a0a}
.poster.light .bottom{border-top-color:#0a0a0a}
.poster.light .stamp,.poster.light .by{color:#0a0a0a}
/* DARK */
.poster.dark{background:#0a0a0a;color:#fafafa}
.poster.dark .top{border-bottom-color:#fafafa}
.poster.dark .bottom{border-top-color:#fafafa}
.poster.dark .stamp,.poster.dark .by{color:#fafafa}
.poster.dark .brand{color:#fafafa}
.poster.dark .meta{color:#ffb703}
.poster.dark h1{color:#fafafa}
.poster.dark h1 em{color:#ffb703}
.poster.dark .lede{color:#fafafa}
.poster.dark .kicker{background:#ffb703;color:#0a0a0a}
/* 通用网格分割 */
.divider{height:6px;background:#0a0a0a;margin:14px 0}
.divider.red{background:#e63946}
.divider.yellow{background:#ffb703}
/* 小框 */
.box{border:5px solid #0a0a0a;padding:18px 22px;background:#fafafa;color:#0a0a0a}
.box.dark{background:#0a0a0a;color:#fafafa;border-color:#0a0a0a}
.box.red{background:#e63946;color:#fafafa;border-color:#0a0a0a}
.box.yellow{background:#ffb703;color:#0a0a0a;border-color:#0a0a0a}
/* 通用页码标记 */
.pgnum{position:absolute;top:36px;right:60px;font-family:"IBM Plex Mono",monospace;font-size:48px;font-weight:900;color:#e63946;line-height:1}
.pgnum.l{color:#0a0a0a}
.pgnum.y{color:#ffb703}
/* 旋转装饰 */
.tilt-l{transform:rotate(-2deg)}
.tilt-r{transform:rotate(2deg)}
.tilt-xl{transform:rotate(-3deg)}
</style></head><body><div class="poster dark"><div class="top"><div class="brand">ERIC的B166ER出品 · P02</div><div class="meta">4 个真问题</div></div><div class="main"><div class="kicker">PROBLEMS · 4 个真问题</div><h1>4 个<u>真问题</u><br><span style="color:#ffb703">戳中你?</span></h1><div class="lede" style="color:#fafafa">不懂 RM 的酒店老板,每天用直觉做定价——结果多付了机会成本都不知道。</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1"><div class="box red" style="padding:20px 22px;position:relative"><div style="font-family:Inter,sans-serif;font-size:78px;font-weight:900;color:#fafafa;line-height:.9;letter-spacing:-.04em">01</div><h3 style="font-family:Noto Sans SC,serif;font-size:26px;font-weight:900;color:#fafafa;margin:8px 0 6px;line-height:1.2">旺季不敢涨价</h3><p style="font-family:Noto Sans SC,sans-serif;font-size:16px;color:#fafafa;line-height:1.5">客人满了但钱没多赚。OCC 再高,ADR 不涨也是虚假繁荣。</p></div><div class="box yellow" style="padding:20px 22px;position:relative"><div style="font-family:Inter,sans-serif;font-size:78px;font-weight:900;color:#0a0a0a;line-height:.9;letter-spacing:-.04em">02</div><h3 style="font-family:Noto Sans SC,serif;font-size:26px;font-weight:900;color:#0a0a0a;margin:8px 0 6px;line-height:1.2">淡季凭感觉</h3><p style="font-family:Noto Sans SC,sans-serif;font-size:16px;color:#0a0a0a;line-height:1.5">永远在饿死和撑死之间摇摆,没有科学依据,越做越亏。</p></div><div class="box yellow" style="padding:20px 22px;position:relative"><div style="font-family:Inter,sans-serif;font-size:78px;font-weight:900;color:#0a0a0a;line-height:.9;letter-spacing:-.04em">03</div><h3 style="font-family:Noto Sans SC,serif;font-size:26px;font-weight:900;color:#0a0a0a;margin:8px 0 6px;line-height:1.2">OTA 佣金痛</h3><p style="font-family:Noto Sans SC,sans-serif;font-size:16px;color:#0a0a0a;line-height:1.5">携程 15% / 美团 12%,降了怕没客人,不降怕没利润。</p></div><div class="box red" style="padding:20px 22px;position:relative"><div style="font-family:Inter,sans-serif;font-size:78px;font-weight:900;color:#fafafa;line-height:.9;letter-spacing:-.04em">04</div><h3 style="font-family:Noto Sans SC,serif;font-size:26px;font-weight:900;color:#fafafa;margin:8px 0 6px;line-height:1.2">RM 课落地难</h3><p style="font-family:Noto Sans SC,sans-serif;font-size:16px;color:#fafafa;line-height:1.5">理论一大筐,一看 Excel 就放弃,实操鸿沟难填。</p></div></div></div><div class="bottom"><div class="stamp">V3 BRUTALIST · P02</div><div class="by"><span class="s"></span>ERIC的B166ER出品</div></div></div></body></html>
