<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<title>大理医养酒店 Mood Board</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f0f;color:#e0e0e0;font-family:"DM Sans","Noto Sans SC",sans-serif;padding:60px;min-height:100vh}
h1{font-size:48px;font-weight:300;letter-spacing:-0.02em;margin-bottom:8px}
.sub{font-size:16px;color:#888;margin-bottom:48px}
.sec{margin-bottom:48px}
.st{font-size:12px;text-transform:uppercase;letter-spacing:.2em;color:#666;margin-bottom:16px}
.palette{display:flex;gap:12px;flex-wrap:wrap}
.swatch{width:100px;height:100px;border-radius:8px;display:flex;align-items:flex-end;padding:8px;font-size:10px;font-family:monospace}
.kws{display:flex;gap:8px;flex-wrap:wrap}
.kw{padding:8px 20px;border:1px solid #333;border-radius:100px;font-size:14px;color:#aaa}
.desc{max-width:600px;font-size:16px;line-height:1.8;color:#aaa}
.foot{margin-top:80px;font-size:11px;color:#444}
</style></head><body>
<h1>大理医养酒店</h1><p class="sub">Mood Board · 生物亲和风格</p>
<div class="sec"><div class="st">Color Palette</div><div class="palette"><div class="swatch" style="background:#4a7c59;" title="#4a7c59"><span>#4a7c59</span></div><div class="swatch" style="background:#8db580;" title="#8db580"><span>#8db580</span></div><div class="swatch" style="background:#d4e4c5;" title="#d4e4c5"><span>#d4e4c5</span></div><div class="swatch" style="background:#f5f0e8;" title="#f5f0e8"><span>#f5f0e8</span></div><div class="swatch" style="background:#2d4a3e;" title="#2d4a3e"><span>#2d4a3e</span></div></div></div>
<div class="sec"><div class="st">Keywords</div><div class="kws"><span class="kw">自然光</span><span class="kw">绿植</span><span class="kw">有机形态</span><span class="kw">疗愈</span><span class="kw">水景</span><span class="kw">木材</span></div></div>
<div class="sec"><div class="st">Design Direction</div><p class="desc">以生物亲和语言在大理打造医养酒店</p></div>
<div class="foot">B166ER Design Studio v2.0 · 2026-05-11</div>
</body></html>
